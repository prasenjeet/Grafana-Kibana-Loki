apiVersion: 1

datasources:
  # ── Prometheus – metrics backend ─────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  # ── Loki – log aggregation backend ──────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: "order_id"
          matcherRegex: '"order_id":"(ORD-[A-Z0-9]+)"'
          url: ""
          datasourceUid: loki
        - name: "trace_id"
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          url: ""
