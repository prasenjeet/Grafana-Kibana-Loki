groups:
  - name: ecommerce_alerts
    rules:
      - alert: HighErrorRate
        expr: |
          rate(application_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanize }} errors/sec over the last 5 minutes."

      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency above 1s"
          description: "p95 latency is {{ $value | humanizeDuration }} for {{ $labels.endpoint }}."

      - alert: LowInventory
        expr: |
          inventory_items_total < 10
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Low inventory for {{ $labels.product }}"
          description: "Only {{ $value }} units remaining for {{ $labels.product }}."

      - alert: ServiceDown
        expr: |
          up{job="ecommerce-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ecommerce-api is down"
          description: "The ecommerce API has been unreachable for more than 1 minute."
