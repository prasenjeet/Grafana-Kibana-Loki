server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: demo
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  # Application logs from the ecommerce-api container
  - job_name: ecommerce-api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["ecommerce-api"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_image"]
        target_label: image
      - target_label: job
        replacement: ecommerce-api
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            service: service
            timestamp: timestamp
            method: "extra.method"
            path: "extra.path"
            status_code: "extra.status_code"
            duration_ms: "extra.duration_ms"
            order_id: "extra.order_id"
            user_id: "extra.user_id"
            error_type: "extra.error_type"
      - labels:
          level:
          service:
          method:
          status_code:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: message

  # System-level container logs (all other containers)
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ["prometheus", "grafana", "loki", "elasticsearch", "kibana", "filebeat"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_image"]
        target_label: image
      - target_label: job
        replacement: containers
